name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install the dependencies
        run: npm ci
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG:-}"
          if [[ -z "${version}" && "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME}"
          fi

          if [[ -z "${version}" ]]; then
            echo "::error::Unable to determine a release version. This workflow was manually run from '${REF_NAME}' (${REF_TYPE}). Publish a GitHub Release, or rerun the workflow with 'Use workflow from' set to a version tag like v1.2.3."
            exit 1
          fi

          VERSION="${version}" npm run version:set
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run pub -- -p "$VSCE_PAT"
